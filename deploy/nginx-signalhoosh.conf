# میکروکش صفحات عمومی — سرور دو هسته‌ای زیر ترافیک بالا نباید هر بار رندر کند
proxy_cache_path /var/cache/nginx/sh levels=1:2 keys_zone=sh_cache:16m
                 max_size=500m inactive=10m use_temp_path=off;

# www → دامنه‌ی اصلی (رفع duplicate content)
server {
    listen 443 ssl;
    server_name www.signalhoosh.site;
    ssl_certificate     /etc/letsencrypt/live/signalhoosh.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalhoosh.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://signalhoosh.site$request_uri;
}

server {
    listen 443 ssl;
    server_name signalhoosh.site;
    ssl_certificate     /etc/letsencrypt/live/signalhoosh.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalhoosh.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 40m;

    location ~ /\. { deny all; }

    # ── API و مسیرهای داخلی → اپ فعلی (۳۰۰۱) ──
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /internal/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── پنل قدیمی (کاربران، کانال‌ها، تنظیمات AI، کرالرها) ──
    location /legacy {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── پنل جدید — هرگز کش نشود ──
    location /admin {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── فایل‌های ثابت و مدیا — کش طولانی ──
    location ~ ^/(news-media|channel-photos|finance-media|assets)/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_cache sh_cache;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache $upstream_cache_status;
    }

    # ── سایت عمومی رندرشده‌ی سمت سرور (۳۰۰۲) با میکروکش ۶۰ ثانیه ──
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache sh_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # کاربر لاگین‌شده و درخواست‌های POST هرگز کش نمی‌شوند
        proxy_cache_bypass $cookie_token;
        proxy_no_cache     $cookie_token;
        add_header X-Cache $upstream_cache_status;
    }
}

server {
    listen 80;
    server_name signalhoosh.site www.signalhoosh.site;
    return 301 https://signalhoosh.site$request_uri;
}
